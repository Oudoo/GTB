# Local PostgreSQL 16 for the Al Qarib sandbox.
#
#   docker compose up -d db      # start the server (superuser password from POSTGRES_ADMIN_PASSWORD)
#   pnpm db:local                # create the two application roles and the database through
#                                # POSTGRES_ADMIN_URL (idempotent, drops nothing)
#   pnpm db:migrate && pnpm db:seed
#
# The application never connects as the superuser: `alqarib_owner` runs migrations and
# `alqarib_app` (no DDL, append-only audit) runs the app and the worker.
#
# NOT EXECUTED in the implementation environment (it has no Docker daemon); the tested path
# there is a local PostgreSQL 16 cluster with `pnpm db:local`. See docs/RUNBOOK.md.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env (any local value) before starting the database}
    ports:
      # Loopback only: the sandbox database is not offered to the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - alqarib_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  alqarib_pg:
